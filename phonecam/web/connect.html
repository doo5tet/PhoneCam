<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PhoneCam · Scan with your phone</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;color:#fff;
       font:500 17px/1.45 -apple-system,"SF Pro Text",system-ui,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;
       background:radial-gradient(110% 80% at 50% 0%,#2b2b38 0%,#0c0c12 55%,#000 100%)}
  .card{width:min(520px,92vw);text-align:center;padding:30px 28px;border-radius:28px;background:rgba(44,44,52,.42);
        -webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%);border:.5px solid rgba(255,255,255,.14);
        box-shadow:0 30px 80px rgba(0,0,0,.5),inset 0 .5px 0 rgba(255,255,255,.12)}
  img.qr{width:300px;height:300px;border-radius:20px;background:#fff;padding:10px;display:block;margin:18px auto}
  h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.02em}
  p{color:rgba(235,235,245,.62);margin:6px 0}
  b{color:#fff}
  .steps{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
  .s{background:rgba(255,255,255,.08);border-radius:14px;padding:10px 12px;font-size:14px;color:rgba(235,235,245,.8)}
  .s i{font-style:normal;color:#ffd60a;font-weight:800;margin-right:6px}
  code{font-size:13px;color:rgba(235,235,245,.5);word-break:break-all}
</style>
</head><body><div class="card">
  <h1>Scan with your phone</h1>
  <p>Open your phone's <b>Camera</b> app and point it at the code.</p>
  <img class="qr" id="qr" src="/qr.png" alt="QR code">
  <div class="steps"><div class="s"><i>1</i>Same Wi-Fi as this computer</div><div class="s"><i>2</i>Scan</div><div class="s"><i>3</i>Follow the steps on the phone</div></div>
  <p style="margin-top:14px;font-size:13px">Or type this on your phone:<br><code>{{SETUP_URL}}</code></p>
</div>
<script>setInterval(() => { document.getElementById("qr").src = "/qr.png?t=" + Date.now(); }, 5000);</script>
</body></html>
